<svg xmlns="http://www.w3.org/2000/svg" width="1538" height="940" viewBox="0 0 1538 940" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="round"><rect width="1538" height="940" rx="36" ry="36"/></clipPath>
    <linearGradient id="leftBg" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="btnShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#059669" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g clip-path="url(#round)">

  <!-- Backgrounds -->
  <rect width="1538" height="940" fill="#f8fafc"/>
  <rect width="769" height="940" fill="url(#leftBg)"/>

  <!-- ===== LEFT PANEL ===== -->
  <!-- Logo -->
  <circle cx="99" cy="99" r="27" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="99" cy="106" r="3.5"/>
    <circle cx="90" cy="91" r="3.5"/>
    <circle cx="108" cy="91" r="3.5"/>
    <path d="M99 102.5 V99 L91.5 94 M99 99 L106.5 94"/>
  </g>
  <text x="141" y="108" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Time To Program CRM</text>

  <!-- Headline -->
  <g font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.6">
    <text x="72" y="236">Close more deals with</text>
    <text x="72" y="303">an AI co-pilot in your</text>
    <text x="72" y="370">pipeline.</text>
  </g>

  <!-- Sub text -->
  <g font-size="24" fill="#a7f3d0" fill-opacity="0.92">
    <text x="72" y="436">TTP CRM unifies your leads, contacts and follow-ups</text>
    <text x="72" y="472">— then layers Gemini-powered summaries, email</text>
    <text x="72" y="508">drafts and sales insights on top.</text>
  </g>

  <!-- Feature 1 -->
  <circle cx="99" cy="605" r="27" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="88,611 95,604 100,608 111,597"/>
    <polyline points="105,597 111,597 111,603"/>
  </g>
  <text x="144" y="612" font-size="21" fill="#ffffff">Visual pipeline with drag-and-drop stages</text>

  <!-- Feature 2 -->
  <circle cx="99" cy="683" r="27" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="88" y="679" width="22" height="14" rx="3"/>
    <path d="M99 679 V674"/>
    <circle cx="99" cy="672.5" r="1.5"/>
    <path d="M85 685 V688 M113 685 V688"/>
    <path d="M95 685 V687 M103 685 V687"/>
  </g>
  <text x="144" y="690" font-size="21" fill="#ffffff">AI lead scoring &amp; instant email drafting</text>

  <!-- Feature 3 -->
  <circle cx="99" cy="761" r="27" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M99 749 L110 753 V762 C110 769 105 773 99 775 C93 773 88 769 88 762 V753 Z"/>
    <polyline points="94,762 98,766 104,758"/>
  </g>
  <text x="144" y="768" font-size="21" fill="#ffffff">Secure JWT auth, your data stays yours</text>

  <!-- Copyright -->
  <text x="72" y="863" font-size="18" fill="#ffffff" fill-opacity="0.5">© 2026 Time To Program. All rights reserved.</text>

  <!-- ===== RIGHT PANEL ===== -->
  <text x="866" y="208" font-size="38" font-weight="700" fill="#0f172a" letter-spacing="-1">Welcome back</text>
  <text x="866" y="250" font-size="22" fill="#64748b">Sign in to your TTP CRM workspace.</text>

  <!-- Email -->
  <text x="866" y="328" font-size="21" font-weight="500" fill="#0f172a">Email</text>
  <rect x="866.5" y="345.5" width="575" height="59" rx="29.5" fill="#ffffff" stroke="#e5e7eb"/>
  <g fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="886" y="366" width="21" height="17" rx="3"/>
    <polyline points="887,369 896.5,376 906,369"/>
  </g>
  <text x="921" y="383" font-size="22" fill="#9ca3af">you@company.com</text>

  <!-- Password -->
  <text x="866" y="451" font-size="21" font-weight="500" fill="#0f172a">Password</text>
  <rect x="866.5" y="468.5" width="575" height="59" rx="29.5" fill="#ffffff" stroke="#e5e7eb"/>
  <g fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="887" y="496" width="18" height="13" rx="3"/>
    <path d="M891 496 V492 A5 5 0 0 1 901 492 V496"/>
  </g>
  <g fill="#9ca3af">
    <circle cx="926" cy="499" r="3"/><circle cx="938" cy="499" r="3"/><circle cx="950" cy="499" r="3"/>
    <circle cx="962" cy="499" r="3"/><circle cx="974" cy="499" r="3"/><circle cx="986" cy="499" r="3"/>
    <circle cx="998" cy="499" r="3"/><circle cx="1010" cy="499" r="3"/>
  </g>

  <!-- Sign in button -->
  <rect x="866" y="552" width="576" height="72" rx="36" fill="url(#btn)" filter="url(#btnShadow)"/>
  <text x="1154" y="596" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Sign in</text>

  <!-- Demo button -->
  <rect x="866.5" y="642.5" width="575" height="61" rx="30.5" fill="#fbfcfd" stroke="#e5e7eb" stroke-dasharray="3 3" stroke-opacity="0.8"/>
  <text x="1154" y="680" font-size="22" font-weight="600" fill="#047857" text-anchor="middle">Try the demo account</text>

  <!-- Create account -->
  <text x="1154" y="762" font-size="22" text-anchor="middle" fill="#64748b"><tspan>Don't have an account? </tspan><tspan fill="#047857" font-weight="700">Create one</tspan></text>
  </g>
</svg>
